name: Publish

on:
  push:
    branches:
      - main
    paths:
      - "plugins/**"
      - "repository.json"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish releases and rebuild the index
        run: python3 scripts/publish.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A plugins index.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: publish releases and rebuild the index"
          git push
