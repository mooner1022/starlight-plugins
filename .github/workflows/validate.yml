name: Validate

on:
  pull_request:
    paths:
      - "plugins/**"
      - "repository.json"
      - "scripts/**"
      - ".github/workflows/**"
  push:
    branches-ignore:
      - main
    paths:
      - "plugins/**"
      - "repository.json"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugins
        run: python3 scripts/validate.py
